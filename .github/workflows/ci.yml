name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  audit-and-test:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run Code Linting (ESLint)
        run: npm run lint

      - name: Run Backend Tests (Node Test Runner + Supertest)
        run: npm run test:backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_mana_drivers_2026_super_safe

      - name: Run Frontend Tests (Vitest + React Testing Library)
        run: npm run test:frontend

      - name: Build Frontend Production Bundle (Vite)
        run: npm run build --workspace=frontend

      - name: Verify Backend Integrity
        run: node -c backend/server.js
